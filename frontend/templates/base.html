<!DOCTYPE html>
<html lang="ar" dir="rtl" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>هيمنة النجاح | شركاء النجاح</title>
  <meta name="description" content="معرض تفاعلي لشراكات فريق هيمنة النجاح.">
  <meta name="theme-color" content="#24304D">
  <script src="{{ url_for('static', filename='js/boot.js') }}"></script>
  <link rel="preload" href="{{ url_for('static', filename='fonts/tajawal-arabic-500-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="{{ url_for('static', filename='images/haymanat-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip_to_content">تخطَّ إلى المحتوى</a>

  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-total" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 12l2.5 2.5L16 9M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></symbol>
      <symbol id="i-organizations" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 21V8l8-5 8 5v13M9 21v-6h6v6M8 11h.01M12 11h.01M16 11h.01"/></symbol>
      <symbol id="i-clubs" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 11a3 3 0 100-6 3 3 0 000 6zM17 11a2.5 2.5 0 100-5M3 20c0-3 2.7-5 6-5s6 2 6 5M16 15c2.8 0 5 1.7 5 4"/></symbol>
      <symbol id="i-volunteer_teams" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.600-7 10-7 10z"/></symbol>
      <symbol id="i-initiatives" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3l2.2 5.300 5.800.5-4.400 3.800 1.400 5.600L12 15l-5 3.200 1.400-5.600L4 8.800l5.800-.5z"/></symbol>
      <symbol id="i-hackathons" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.500 5l-3 14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></symbol>
    </defs>
  </svg>

  {% block body %}{% endblock %}

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
